targets:
  DcampReadingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReadingTests
    dependencies:
      - target: Dcamp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTS_MACCATALYST: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/dcamp.app/dcamp"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/dcamp.app/Contents/MacOS/dcamp"

  DcampReadingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReadingUITests
    dependencies:
      - target: Dcamp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DcampReading:
    build:
      targets:
        Dcamp: all
    test:
      targets:
        - DcampReadingTests
        - DcampReadingUITests
