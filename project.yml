name: Dcamp
options:
  bundleIdPrefix: com.decentespresso
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.15"
    CURRENT_PROJECT_VERSION: "16"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your Apple Developer Team ID for device/App Store builds
    CODE_SIGN_STYLE: Automatic

targets:
  Dcamp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decentespresso.dcamp
        PRODUCT_NAME: dcamp
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        CODE_SIGN_ENTITLEMENTS: Resources/Dcamp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
